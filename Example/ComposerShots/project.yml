name: ComposerShots
options:
  bundleIdPrefix: no.eidlaug.shots
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
packages:
  GlassComposer:
    path: ../..
targets:
  ComposerShots:
    type: application
    supportedDestinations: [iOS, macOS]
    sources: [Sources]
    dependencies:
      - package: GlassComposer
    info:
      path: Info.plist
      properties:
        UILaunchScreen: {}
        NSMicrophoneUsageDescription: Dictation.
        NSSpeechRecognitionUsageDescription: Dictation.
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        LSMinimumSystemVersion: "26.0"
    settings:
      base:
        SWIFT_VERSION: "6.0"
        CODE_SIGNING_ALLOWED: NO
