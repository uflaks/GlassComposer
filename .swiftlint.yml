included:
  - Sources
  - Tests
excluded:
  - .build

opt_in_rules:
  - vertical_whitespace_opening_braces
  - vertical_whitespace_closing_braces

identifier_name:
  excluded:
    - a
    - b
    - b1
    - b2
    - ba
    - bb
    - bg
    - br
    - c
    - ca
    - d
    - d1
    - d2
    - fg
    - g
    - hi
    - i
    - id
    - j
    - lo
    - n
    - ns
    - o1
    - o2
    - oa
    - ob
    - og
    - or
    - p
    - pe
    - r
    - rs
    - s
    - s1
    - s2
    - t
    - u
    - y

nesting:
  type_level:
    warning: 2

line_length:
  warning: 160
  error: 200
  ignores_urls: true

function_parameter_count:
  warning: 7
  error: 9

function_body_length:
  warning: 60
  error: 120

type_body_length:
  warning: 350
  error: 500

file_length:
  warning: 500
  error: 1000

cyclomatic_complexity:
  warning: 15
  error: 25
